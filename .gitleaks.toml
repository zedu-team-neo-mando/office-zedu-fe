title = "gitleaks config"

[extend]
# --config replaces the built-in ruleset unless this is set.
# Without it, this file had zero detection rules so hardcoded keys never failed.
useDefault = true

[[rules]]
id = "hardcoded-source-secret"
description = "High-entropy string assigned in source, excluding common UUID/test fixture IDs"
regex = '''(?i)(?:const|let|var)\s+[A-Za-z_][\w]*\s*=\s*['"]([A-Za-z0-9+=_.-]{20,})['"]'''
entropy = 3.5
keywords = [
  "const",
  "let",
  "var",
]

[allowlist]
description = "Allow known test fixtures, generated files, and UUID-like fixture IDs"
paths = [
  '''integration\.json''',
  '''(?:^|/)\.github/''',
  '''(?:^|/)cypress/''',
]
regexes = [
  '''(?i)(?:const|let|var)\s+[A-Za-z_][\w]*\s*=\s*['"][0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-5][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}['"]''',
  '''(?i)(?:const|let|var)\s+[A-Za-z_][\w]*\s*=\s*['"][0-9a-fA-F]{32}['"]''',
]
